<!DOCTYPE html>
<html>
<head>
    <title>Manage Users</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #007BFF;
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        .navbar button {
            background: white;
            color: #007BFF;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .nav-link {
            margin-left: 15px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            padding: 6px 10px;
            border-radius: 5px;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.35);
        }

        /* Main */
        .container {
            padding: 30px;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #007BFF;
            color: white;
            text-align: left;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f1f1f1;
        }

        /* Buttons */
        .btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .view { background: #17a2b8; color: white; }
        .edit { background: #ffc107; }
        .delete { background: #dc3545; color: white; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }

        .modal-content {
            background: white;
            padding: 20px;
            margin: 10% auto;
            width: 320px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }

        .message {
            margin-bottom: 10px;
            font-size: 14px;
        }

        .error { color: red; }
        .success { color: green; }
    </style>
</head>

<body>

<div class="navbar">
    <div>
        <strong>User Management</strong>
        <a href="/dashboard.html" class="nav-link">← Back to Dashboard</a>
    </div>
    <button onclick="logout()">Logout</button>
</div>

<div class="container">
    <h2>Users</h2>
    <div id="message" class="message"></div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="userTable"></tbody>
    </table>
</div>

<!-- Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h3>User Details</h3>

        <input id="username" placeholder="Name">
        <input id="email" placeholder="Email">
        <input id="phone" placeholder="Phone">

        <button onclick="saveUser()">Save</button>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = "/login.html";

let currentUserId = null;

function showMessage(msg, type="success") {
    const div = document.getElementById('message');
    div.textContent = msg;
    div.className = `message ${type}`;
}

async function loadUsers() {
    const res = await fetch('/users', {
        headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.status === 401) {
        window.location.href = "/login.html";
        return;
    }

    const users = await res.json();
    const table = document.getElementById('userTable');
    table.innerHTML = '';

    users.forEach(u => {
        const row = document.createElement('tr');

        row.innerHTML = `
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.phone}</td>
            <td>
                <button class="btn view" onclick="viewUser('${u._id}')">View</button>
                <button class="btn edit" onclick="editUser('${u._id}')">Edit</button>
                <button class="btn delete" onclick="deleteUser('${u._id}')">Delete</button>
            </td>
        `;

        table.appendChild(row);
    });
}

async function deleteUser(id) {
    if (!confirm("Delete this user?")) return;

    await fetch(`/users/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}` }
    });

    showMessage("User deleted");
    loadUsers();
}

async function viewUser(id) {
    const res = await fetch(`/users/${id}`, {
        headers: { 'Authorization': `Bearer ${token}` }
    });

    const user = await res.json();

    currentUserId = null;

    username.value = user.name;
    email.value = user.email;
    phone.value = user.phone;

    openModal(true);
}

async function editUser(id) {
    const res = await fetch(`/users/${id}`, {
        headers: { 'Authorization': `Bearer ${token}` }
    });

    const user = await res.json();

    currentUserId = id;

    username.value = user.name;
    email.value = user.email;
    phone.value = user.phone;

    openModal(false);
}

async function saveUser() {
    if (!currentUserId) return;

    await fetch(`/users/${currentUserId}`, {
        method: 'PUT',
        headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            name: username.value,
            email: email.value,
            phone: phone.value
        })
    });

    closeModal();
    showMessage("User updated");
    loadUsers();
}

function openModal(readOnly) {
    document.getElementById('modal').style.display = 'block';

    username.disabled = readOnly;
    email.disabled = readOnly;
    phone.disabled = readOnly;
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

function logout() {
    localStorage.removeItem('token');
    window.location.href = "/login.html";
}

loadUsers();
</script>

</body>
</html>
