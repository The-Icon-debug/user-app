<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #007BFF, #00c6ff);
            color: white;
            text-align: center;
            padding: 100px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .buttons {
            margin-top: 30px;
        }

        a {
            text-decoration: none;
            padding: 12px 20px;
            margin: 10px;
            background: white;
            color: #007BFF;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>Welcome to User Management App</h1>
<p>Manage users securely with authentication</p>

<div class="buttons">
    <a href="/login.html">Login</a>
    <a href="/signup.html">Sign Up</a>
</div>

<script>
// If already logged in → go to dashboard
const token = localStorage.getItem('token');

if (token) {
    window.location.href = "/dashboard.html";
}
</script>

</body>
</html>
