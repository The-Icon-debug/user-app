<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #007BFF;
            color: white;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar button {
            background: white;
            color: #007BFF;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .navbar button:hover {
            background: #f0f0f0;
        }

        /* Main Content */
        .main {
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 40px;
        }

        /* Cards */
        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 25px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            color: #666;
        }

        .card a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: white;
            background: #007BFF;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .card a:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<!-- Top Bar -->
<div class="navbar">
    <h2>User Dashboard</h2>
    <button onclick="logout()">Logout</button>
</div>

<!-- Main Section -->
<div class="main">
    <h1>Welcome 👋</h1>
    <p class="subtitle">Manage your users efficiently</p>

    <div class="container">
        <div class="card">
            <h3>➕ Create User</h3>
            <p>Add a new user to the system</p>
            <a href="/create.html">Go</a>
        </div>

        <div class="card">
            <h3>📄 View Users</h3>
            <p>Browse, edit and manage users</p>
            <a href="/view.html">Go</a>
        </div>
    </div>
</div>

<script>
// Auth check
const token = localStorage.getItem('token');

if (!token) {
    window.location.href = "/index.html";
}

// Logout
function logout() {
    localStorage.removeItem('token');
    window.location.href = "/login.html";
}
</script>

</body>
</html>
