<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #28a745, #85e085);
        }

        .signup-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1e7e34;
        }

        .link {
            margin-top: 15px;
            font-size: 14px;
        }

        .link a {
            text-decoration: none;
            color: #28a745;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .success {
            color: green;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="signup-container">
    <h2>Create Account</h2>

    <div id="message"></div>

    <form id="signupForm">
        <input type="text" id="username" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phone" placeholder="Phone" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="submitBtn" type="submit">Register</button>
    </form>

    <div class="link">
        Already have an account? <a href="/login.html">Login</a>
    </div>
</div>

<script>
document.getElementById('signupForm').onsubmit = async (e) => {
    e.preventDefault();

    const messageDiv = document.getElementById('message');
    const button = document.getElementById('submitBtn');

    messageDiv.textContent = "";
    messageDiv.className = "";

    // loading state
    button.disabled = true;
    button.textContent = "Registering...";

    const res = await fetch('/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            name: username.value,
            email: email.value,
            phone: phone.value,
            password: password.value
        })
    });

    const data = await res.json();

    if (res.status === 201) {
        messageDiv.textContent = "Account created! Redirecting to login...";
        messageDiv.className = "success";

        setTimeout(() => {
            window.location.href = "/login.html";
        }, 1500);
    } else {
        messageDiv.textContent = data.error || "Signup failed";
        messageDiv.className = "error";
    }

    button.disabled = false;
    button.textContent = "Register";
};
</script>

</body>
</html>
